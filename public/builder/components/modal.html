<div class="modal fade" id="dynamicModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content shadow border-0 position-relative">
      <!-- Cross button at the top right -->
      <button type="button" class="btn-close position-absolute end-0 top-0 m-3"
        id="dynamic-modal-close-btn"
        aria-label="Close"
        data-bs-dismiss="modal"></button>
      <div class="modal-body text-center p-4">
        <div class="mb-2" id="dynamic-modal-icon"></div>
        <p class="mb-3 fw-semibold" id="dynamic-modal-message">Default message</p>
      </div>
    </div>
  </div>
</div>
